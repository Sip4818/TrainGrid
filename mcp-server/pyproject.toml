[project]
name = "traingrid-mcp-server"
version = "0.1.0"
description = "TrainGrid MCP server (Streamable HTTP, stateless)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff.lint]
select = ["I", "E", "F", "W"]

[tool.mypy]
ignore_missing_imports = true

[tool.setuptools]
packages = []
