services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traingrid
      POSTGRES_PASSWORD: traingrid
      POSTGRES_DB: traingrid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traingrid -d traingrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${DOCKERHUB_USERNAME:-sahil4818}/traingrid-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://traingrid:traingrid@postgres:5432/traingrid
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-traingrid-artifacts}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_CREATE_BUCKET_ON_INIT: ${S3_CREATE_BUCKET_ON_INIT:-true}
      S3_STRICT: ${S3_STRICT:-false}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000

  worker:
    image: ${DOCKERHUB_USERNAME:-sahil4818}/traingrid-worker:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Prometheus metrics served by the worker process itself (Option D,
      # issue #88). Scrape together with the API's :8000/metrics.
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://traingrid:traingrid@postgres:5432/traingrid
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      TRAINGRID_WORKER_METRICS_PORT: 8001
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-traingrid-artifacts}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_CREATE_BUCKET_ON_INIT: ${S3_CREATE_BUCKET_ON_INIT:-true}
      S3_STRICT: ${S3_STRICT:-false}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.workers.celery_app worker --loglevel=info

  frontend:
    image: ${DOCKERHUB_USERNAME:-sahil4818}/traingrid-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbuckets:
    image: minio/mc:RELEASE.2025-02-28T09-55-16Z
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/$${S3_BUCKET_NAME:-traingrid-artifacts} || true
      "

volumes:
  artifacts:
  minio-data:
