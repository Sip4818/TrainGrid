services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traingrid
      POSTGRES_PASSWORD: traingrid
      POSTGRES_DB: traingrid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traingrid -d traingrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${DOCKERHUB_USERNAME:-sahil4818}/traingrid-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://traingrid:traingrid@postgres:5432/traingrid
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-traingrid-artifacts}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://localstack:4566}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_CREATE_BUCKET_ON_INIT: ${S3_CREATE_BUCKET_ON_INIT:-true}
      S3_STRICT: ${S3_STRICT:-false}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000

  worker:
    image: ${DOCKERHUB_USERNAME:-sahil4818}/traingrid-worker:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Prometheus metrics served by the worker process itself (Option D,
      # issue #88). Scrape together with the API's :8000/metrics.
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://traingrid:traingrid@postgres:5432/traingrid
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      TRAINGRID_WORKER_METRICS_PORT: 8001
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-traingrid-artifacts}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://localstack:4566}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_CREATE_BUCKET_ON_INIT: ${S3_CREATE_BUCKET_ON_INIT:-true}
      S3_STRICT: ${S3_STRICT:-false}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.workers.celery_app worker --loglevel=info

  frontend:
    image: ${DOCKERHUB_USERNAME:-sahil4818}/traingrid-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

  localstack:
    image: localstack/localstack:4
    profiles: ["s3"]
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  artifacts:
  localstack-data:
